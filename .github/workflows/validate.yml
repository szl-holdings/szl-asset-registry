name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python tools/validate.py
      - run: python -m unittest discover -s tests -p 'test_model_hygiene.py' -v
      - run: python -m unittest discover -s tests -p 'test_drift_gate.py' -v
      - run: python -m unittest discover -s tests -p 'test_coverage_check.py' -v
      - run: python -m unittest discover -s tests -p 'test_build_catalog.py' -v
      - run: python tools/test_unmapped_reasons.py
      - name: Coverage gate (independent recomputation: 666 = 648 mapped + 18 unmapped; 10 unresolved inside 18)
        run: python tools/coverage_check.py
      - name: Catalog deterministic replay (regenerated catalog must be byte-identical to committed bytes)
        run: |
          python tools/build_catalog.py .
          git diff --exit-code -- data/
