name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@4d9e5bf4f62d48c926c7a1f9e0e36140c10b0958
        with:
          python-version: "3.12"
      - run: python tools/validate.py
